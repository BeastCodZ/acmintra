name: cashguard_app
description: "CashGuard — Counterfeit Indian currency detector"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  camera: ^0.11.0+2
  image_picker: ^1.1.2
  onnxruntime: ^1.4.1
  image: ^4.3.0
  path_provider: ^2.1.5
  permission_handler: ^11.4.0
  google_mlkit_text_recognition: ^0.14.0
  shared_preferences: ^2.3.3
  intl: ^0.19.0
  file_picker: ^8.1.4
  http: ^1.2.2
  syncfusion_flutter_pdf: ^27.2.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.2

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/app_icon.png"

flutter:
  uses-material-design: true
  assets:
    - assets/currency_classifier.onnx
